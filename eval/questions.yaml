# 검색 품질 평가 문항.
# expect_article 은 전부 실제 적재 대상 법령의 조문을 확인하고 적은 것이다(추정 아님).
# 질의는 조문 제목을 그대로 베끼지 않고 사람이 물어볼 법한 말로 쓴다 —
# 조문 제목을 그대로 쓰면 키워드 검색이 거저 맞혀서 지표가 부풀려진다.

#
# 문항을 늘릴 때의 절차 (세션 3에서 15 → 30, 세션 6에서 30 → 50 으로 늘리며 지킨 것):
#   1. 정답 조문을 **검색 성능과 무관하게** 고른다. 고정 시드 무작위 표본에서
#      실질 내용이 있는 조문(본문 200~2,500자)을 뽑아 골랐다.
#   2. 정답이 본법·시행령 양쪽에 걸리는 주제는 **버린다**. 예: '재해손실 세액공제'는
#      법 제58조와 시행규칙 제49조에 다 있어 정답이 하나로 안 나온다.
#   3. 조문 본문만 보고 질문을 쓴다. **이 단계에서 검색을 돌리지 않는다** —
#      돌리면 잘 맞는 질문만 남기게 되고, 그건 불변식 5 를 우회하는 짓이다.
#   4. 다 쓴 뒤 eval 을 한 번 돌리고, 지표가 떨어져도 문항을 고치지 않는다.
#
# 세션 6에서 30 → 50 으로 늘리며 알게 된 것 (다음에 늘릴 때 시간을 아낀다):
#   * 절차 2가 생각보다 훨씬 빡빡하다. 고정 시드(0.4207) 표본 481개 중 **244개가
#     주제 겹침으로 탈락**했다. 법인세법 계열은 법-시행령-시행규칙이 촘촘히 짝지어져
#     있어서, 조 번호가 달라도 같은 주제를 나눠 규정한다.
#     겹침은 **조 번호가 아니라 제목**으로 판정해야 한다 — '대손금의 손금불산입'은
#     법 제19조의2와 시행령 제19조의2가 제목까지 같지만, '국고보조금'은
#     법 제36조 / 시행령 제64조로 번호가 전혀 다르다.
#   * 같은 법령 안 가지번호 계열도 버려야 한다. '분할'은 법 제46조·제46조의2·
#     제46조의3·제46조의4·제47조로 다섯 조문이라 정답이 하나로 안 나온다.
#   * **외감법 계열은 후보가 거의 고갈됐다.** 법 52조문 중 살아남은 후보가 13개인데
#     그중 4개가 제목이 그냥 '벌칙'이고(제40·41·42·44조) 2개가 손해배상공동기금
#     쌍이다. 시행령도 17개 중 대부분이 법과 짝이다. 그래서 이번 20문항을
#     법인세 13 / 외부감사 7 로 나눴다 — 기존 30문항의 20/10 비율을 그대로
#     이어가려 했으나 뽑을 조문이 없었다. 다음에 더 늘리려면 외감법은 사실상 끝이다.
#   * 아래 두 절(세션 6 추가)은 기존 30문항 뒤에 붙였다. 기존 30문항을 그 자리에
