# 일상용어 → 법령용어. 질의 전처리에서 조회만 하고 **임베딩하지 않는다**.
#
# 추측으로 채우지 않았다. 각 항목은 실제 코퍼스(1,127청크)에서 일상어가 드물거나
# 아예 없고 법령용어는 흔하다는 것을 세어 보고 넣은 것이다. 괄호 안이 등장 청크 수.
# 새 항목을 넣기 전에 같은 방식으로 세어 볼 것:
#   SELECT count(*) FROM chunk WHERE text LIKE '%용어%';

접대비: [기업업무추진비]        # 접대비(0) → 기업업무추진비(19). 법이 용어를 개정했다
접대: [기업업무추진비]          # 접대(1)

적자: [결손금, 이월결손금]      # 적자(1) → 결손금(77) / 이월결손금(32)
회계기간: [사업연도]            # 회계기간(6) → 사업연도(449)
회계연도: [사업연도]            # 회계연도(0)

처벌: [벌칙, 징역, 벌금]        # 처벌(1) → 벌칙(6) / 징역(10) / 벌금(13)
세금: [조세]                    # 세금(19) → 조세(134)

# --- 세션 3 추가분 ---------------------------------------------------------
# 법제처 지식베이스 `lstrmRlt`(법령용어→일상용어)에서 길어 올렸다. 고른 절차:
#   1. 코퍼스 조문에 실제로 붙어 있는 법령용어를 joRltLstrm 으로 모아 빈도순 정렬
#      (eval 실패 문항을 보고 고르지 않는다 — 그러면 문항에 맞추는 것이다)
#   2. 그 법령용어의 일상어를 lstrmRlt 로 조회
#   3. **다의어는 통째로 버린다.** `경정` 은 <법령용어> 항목이 4개(납세 경정 / 보트경주 /
#      바르게 고침 / 경찰계급)로 나뉘어 오는데, 평평하게 훑으면 `경주`→`경정` 이 들어온다
#   4. **반의어(140302)는 버린다.** 실제로 `모회사`↔`자회사` 가 반의어로 걸려 있었다
#   5. 코퍼스 등장 횟수를 세어 확인 (괄호 안 숫자)
# 부분문자열 매칭(`terms.py: common in text`)이라 띄어쓰기 있는 말은 안 걸린다.

감사자: [감사인]                # 감사자(0) → 감사인(103)
외국회사: [외국법인]            # 외국회사(0) → 외국법인(158)
내역서: [명세서]                # 내역서(0) → 명세서(102)
영리사업: [수익사업]            # 영리사업(4) → 수익사업(35)
수익활동: [수익사업]            # 수익활동(0)
과표: [과세표준]                # 과표(0) → 과세표준(142). 2자라 길이 규칙(3자↑)의 예외 —
                                # 과세표준의 가장 흔한 구어라 손으로 넣었다
과세기준: [과세표준]            # 과세기준(2)
손실금: [결손금]                # 손실금(2) → 결손금(77). §6 함정 4의 `적자`→`손실금`→`결손금` 경로
이월손실금: [이월결손금]        # 이월손실금(0) → 이월결손금(32)
특수관계자: [특수관계인]        # 특수관계자(1) → 특수관계인(43)
신탁자산: [신탁재산]            # 신탁자산(0) → 신탁재산(33)
양도수익: [양도소득]            # 양도수익(0) → 양도소득(58)

# 외부감사 축.
모회사: [지배회사]              # 모회사(5) → 지배회사(7)

# `자회사: [종속회사]` 는 **넣었다가 뺐다.** 자회사(41)가 종속회사(5)보다 흔해서
# "법령용어가 일상어보다 흔할 것"이라는 규칙에 원래 걸렸는데, "외감법 코퍼스가 작으니
# 예외로 두자"고 손으로 통과시켰다. 측정해 보니 「자회사한테서 받은 배당금」 문항이
# 1위 → 5위로 깨졌다 — 법인세 질의가 외감법 쪽으로 끌려간 것이다. 규칙이 옳았다.
